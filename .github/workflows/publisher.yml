name: Sosyal Medya Otomasyon ve AI Analiz Motoru

on:
  schedule:
    - cron: '11 * * * *'   # Her saat :11 geçe paylaşım & temizlik kontrolü (saat başı yoğunluğunu aşar)
    - cron: '7 6 * * *'    # Her sabah 09:07 TR (06:07 UTC) AI Analiz, Trend Maili & Stok Alarmı
  workflow_dispatch:
    inputs:
      run_advisor:
        description: 'AI Koç ve Trend Mailini hemen test et'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Paylaşım, İlk Yorum, Thumbnail ve SQLite Senkron Motoru
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ARCHIVE_ROOT_ID: ${{ secrets.DRIVE_ARCHIVE_ROOT_ID }}
        run: python bot/main.py

      - name: Sabah 09:00 AI Koç, Trend Bülteni ve Stok Alarmı
        if: github.event.schedule == '7 6 * * *' || inputs.run_advisor == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python bot/ai_advisor.py

      - name: SQLite Yedeğini Repoya Kaydet
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Otomasyon Bot"
          git add database/accounts.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sqlite senkronizasyonu" && git push)
